services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rgm-webservice-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/data
    expose:
      - "${REACT_APP_BACKEND_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${REACT_APP_BACKEND_PORT}/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rgm-webservice-frontend
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
