services:
  backend:
    build: ./backend
    container_name: lmz-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3013:3013"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lmz-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:8081"
    depends_on:
      - backend
