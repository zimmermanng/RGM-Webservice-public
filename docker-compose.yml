services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lmz-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/data
    expose:
      - "3011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lmz-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
