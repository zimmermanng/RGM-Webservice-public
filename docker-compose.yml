services:
  backend:
    build: ./backend
    ports:
      - "3011:3011"   # host:container
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:3011
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3010:3000"   # CRA
      # If Vite: use "5173:5173" instead
    environment:
      # makes file watching reliable in Docker
      - CHOKIDAR_USEPOLLING=true
      # API URL used by the frontend (adjust to your app)
      - REACT_APP_API_URL=http://localhost:3010
      # If Vite: VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules