name: ue-test
services:
  backend:
    build: ./backend
    container_name: ue-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3013:3013"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ue-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:8080"
    depends_on:
      - backend
