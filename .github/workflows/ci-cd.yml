name: CI/CD

on: 
  push:
   branches: 
    - main
    - CICD 
  pull_request:
   branches: 
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
           .
           backend
           frontend

      - name: Create .env file from secrets
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PORT: ${{ secrets.PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REACT_APP_BACKEND_PORT: ${{ secrets.REACT_APP_BACKEND_PORT }}
          NODE_ENV: ${{ secrets.NODE_ENV }} 
          SESSION_TIMEOUT_MS: ${{ secrets.SESSION_TIMEOUT_MS }}
          SESSION_WARNING_MS: ${{ secrets.SESSION_WARNING_MS }}
        run: | 
          cat <<EOF > .env
          DATABASE_URL="$DATABASE_URL"
          APP_PASSWORD="$APP_PASSWORD"
          SESSION_SECRET="$SESSION_SECRET"
          FRONTEND_URL="$FRONTEND_URL"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          NODE_ENV="$NODE_ENV"
          SESSION_TIMEOUT_MS="$SESSION_TIMEOUT_MS"
          SESSION_WARNING_MS="$SESSION_WARNING_MS"
          EOF
          mv .env ./backend

          cat <<EOF > .env
          PORT="$PORT"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          NODE_ENV="$NODE_ENV"
          EOF
          mv .env ./frontend

          cat <<EOF > .env
          PORT="$PORT"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          EOF
      
      - name: Build docker images
        run: |
              docker compose build
      
      - name: Save docker images
        run: |
              docker image save -o ${{ runner.temp }}/rgm-webservice-frontend.tar rgm-webservice-frontend
              docker image save -o ${{ runner.temp }}/rgm-webservice-backend.tar rgm-webservice-backend 
      
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgm-webservice-frontend
          path: ${{ runner.temp }}/rgm-webservice-frontend.tar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgm-webservice-backend
          path: ${{ runner.temp }}/rgm-webservice-backend.tar

  upload:
    name: Upload docker images
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: rgm-webservice-frontend
          path: ${{ runner.temp }}

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: rgm-webservice-backend
          path: ${{ runner.temp }}
      
      - name: Load images
        run: |
              docker load --input ${{ runner.temp }}/rgm-webservice-frontend.tar
              docker load --input ${{ runner.temp }}/rgm-webservice-backend.tar
              docker image ls -a

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Retrieve commit SHA
        id: commit
        uses: prompt/actions-commit-hash@v4 
        
      - name: Tag images
        run: |
              docker tag rgm-webservice-frontend ${{ secrets.DOCKER_REGISTRY_USER }}/${{ secrets.DOCKER_REPOSITORY_FRONTEND }}:${{ steps.commit.outputs.short }}
              docker tag rgm-webservice-backend ${{ secrets.DOCKER_REGISTRY_USER }}/${{ secrets.DOCKER_REPOSITORY_BACKEND }}:${{ steps.commit.outputs.short }}
              docker image ls -a

      - name: Push images
        run: |
              docker push ${{ secrets.DOCKER_REGISTRY_USER }}/${{ secrets.DOCKER_REPOSITORY_FRONTEND }}:${{ steps.commit.outputs.short }}
              docker push ${{ secrets.DOCKER_REGISTRY_USER }}/${{ secrets.DOCKER_REPOSITORY_BACKEND }}:${{ steps.commit.outputs.short }}
         
  
  deploy:
    name: Deploy 
    runs-on: ubuntu-latest
    needs: [build, upload]
    steps:
     - run: echo "Deploy docker image..."