name: CI/CD

on: 
  push:
   branches: 
    - main
    - CICD 
  pull_request:
   branches: 
    - main
    
env: 
  DOCKER_IMAGE_NAME_FRONTEND: rgm-frontend
  DOCKER_IMAGE_NAME_BACKEND: rgm-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
           .
           backend
           frontend
      
      - name: Retrieve commit SHA
        id: commit
        uses: prompt/actions-commit-hash@v4 

      - name: Create .env file from secrets
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PORT: ${{ secrets.PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REACT_APP_BACKEND_PORT: ${{ secrets.REACT_APP_BACKEND_PORT }}
          NODE_ENV: ${{ secrets.NODE_ENV }} 
          SESSION_TIMEOUT_MS: ${{ secrets.SESSION_TIMEOUT_MS }}
          SESSION_WARNING_MS: ${{ secrets.SESSION_WARNING_MS }}
        run: | 
          cat <<EOF > .env
          DATABASE_URL="$DATABASE_URL"
          APP_PASSWORD="$APP_PASSWORD"
          SESSION_SECRET="$SESSION_SECRET"
          FRONTEND_URL="$FRONTEND_URL"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          NODE_ENV="$NODE_ENV"
          SESSION_TIMEOUT_MS="$SESSION_TIMEOUT_MS"
          SESSION_WARNING_MS="$SESSION_WARNING_MS"
          EOF
          mv .env ./backend

          cat <<EOF > .env
          PORT="$PORT"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          NODE_ENV="$NODE_ENV"
          EOF
          mv .env ./frontend

          cat <<EOF > .env
          PORT="$PORT"
          REACT_APP_BACKEND_PORT="$REACT_APP_BACKEND_PORT"
          EOF
      
      - name: Build docker images
        run: |
              echo Building images for Commit: ${{ steps.commit.outputs.short }}.
              docker compose build

  upload:
    name: Upload docker images
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  
  deploy:
    name: Deploy 
    runs-on: ubuntu-latest
    needs: [build, upload]
    steps:
     - run: echo "Deploy docker image..."