name: CI/CD

on: 
  push:
   branches: 
    - main
    - CICD 
  pull_request:
   branches: 
    - main
    
env: 
  DOCKER_IMAGE_NAME_FRONTEND: rgm-frontend
  DOCKER_IMAGE_NAME_BACKEND: rgm-backend

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - id: commit
        uses: prompt/actions-commit-hash@v4 
      - run: echo "Build ${{env.DOCKER_IMAGE_NAME_FRONTEND}}/${{ steps.commit.outputs.short }} docker image ..."
      - run: docker build ./frontend/Dockerfile
  
  build-backend:
    runs-on: ubuntu-latest
    steps: 
     - run: echo "Build ${{env.DOCKER_IMAGE_NAME_BACKEND}}/${{ steps.commit.outputs.short }} docker image ..."
     - run: docker build ./backend/Dockerfile

  upload:
    runs-on: ubuntu-latest
    steps:
     - run: echo "Upload docker image..."
  
  deploy: 
    runs-on: ubuntu-latest
    steps:
     - run: echo "Deploy docker image..."
